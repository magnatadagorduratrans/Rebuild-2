name: Build ZWhisper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o ZWhisper-Rebuilt-GitHub-Actions-v2.zip -d extracted

      - name: Fix Android Gradle Plugin
        run: |
          sed -i "s/id 'com.android.application'/id 'com.android.application' version '8.7.3'/" extracted/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZWhisper-Rebuilt-debug
          path: extracted/app/build/outputs/apk/debug/*.apk
